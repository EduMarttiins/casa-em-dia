name: Build CasaToda Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "v35.js"
      - "v37.js"
      - "v42.js"
      - "v43.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

concurrency:
  group: casatoda-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build_apk
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p downloads
          set +e
          gradle -p android :app:assembleDebug 2>&1 | tee downloads/build-log.txt
          CODE=${PIPESTATUS[0]}
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Prepare public test package
        if: always()
        shell: bash
        run: |
          mkdir -p downloads
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            cp "$APK" downloads/CasaToda-Filhos-Teste.apk
            {
              echo "SUCESSO"
              echo "APK gerado em $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              echo "Commit: $GITHUB_SHA"
            } > downloads/build-status.txt
          else
            {
              echo "FALHA"
              echo "O APK não foi gerado."
              echo "Commit: $GITHUB_SHA"
              echo "Código do Gradle: ${{ steps.build_apk.outputs.exit_code }}"
            } > downloads/build-status.txt
          fi

      - name: Commit APK and build status
        if: always()
        shell: bash
        run: |
          git config user.name "CasaToda Builder"
          git config user.email "actions@users.noreply.github.com"
          git add downloads
          if ! git diff --cached --quiet; then
            git commit -m "Android: atualizar APK de teste"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 3
            done
            exit 1
          fi

      - name: Upload APK artifact
        if: ${{ always() && hashFiles('android/app/build/outputs/apk/debug/app-debug.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: CasaToda-child-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
