name: Publicação legada da Lousa desativada

# Este workflow antigo remontava automaticamente a versão 34 sempre que
# manifest.webmanifest era alterado, sobrescrevendo sw.js e desfazendo as
# versões mais novas. Ele fica mantido apenas como registro e não publica mais.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aviso:
    runs-on: ubuntu-latest
    steps:
      - name: Informar status
        run: |
          echo "O publicador legado da versão 34 está desativado."
          echo "As versões atuais da Lousa de Estudos são publicadas diretamente na branch main."
