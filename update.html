<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atualizando Casa em Dia</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6fb;font-family:system-ui,sans-serif;color:#172033}.c{background:#fff;padding:24px;border-radius:22px;box-shadow:0 18px 50px rgba(18,31,61,.12);text-align:center;max-width:420px}.s{width:34px;height:34px;margin:0 auto 14px;border:4px solid #dfe5f0;border-top-color:#4d7cff;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="c"><div class="s"></div><b>Atualizando Casa em Dia...</b><p>Isso limpa apenas o cache do aplicativo e preserva seus dados.</p></div><script>(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}location.replace('./?fresh='+Date.now())}catch(e){document.querySelector('.c').innerHTML='<b>Não foi possível atualizar automaticamente.</b><p>'+String(e&&e.message?e.message:e)+'</p>'}})();</script></body></html>
