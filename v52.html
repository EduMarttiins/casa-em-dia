<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f9d59">
<meta name="app-version" content="69">
<title>Lousa de Estudos</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8f5;color:#1f2937}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{width:min(100%,420px);background:#fff;border:1px solid #e1ebe4;border-radius:24px;padding:28px;box-shadow:0 18px 48px rgba(20,40,28,.10)}.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #dcebe0;border-top-color:#2f9d59;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:#64748b;line-height:1.5}
</style>
</head>
<body>
<div class="boot"><div class="card"><div class="spinner"></div><strong>Atualizando a Lousa de Estudos</strong><p>Corrigindo um atalho antigo do aplicativo...</p></div></div>
<script>
(()=>{
  const current=new URL(location.href);
  const target=new URL('./start.html',location.href);
  target.searchParams.set('pwa','1');
  target.searchParams.set('legacy','52');
  target.searchParams.set('boot',String(Date.now()));
  try{
    const key='lousa:legacy52:rescued69';
    if(localStorage.getItem(key)!=='1'){
      localStorage.setItem(key,'1');
      target.searchParams.set('force','1');
      target.searchParams.set('update',String(Date.now()));
    }
  }catch(error){}
  if(current.searchParams.get('androidapp')==='1')target.searchParams.set('androidapp','1');
  if(current.searchParams.get('apk'))target.searchParams.set('apk',current.searchParams.get('apk'));
  location.replace(target.toString());
})();
</script>
</body>
</html>
