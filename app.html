<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f9d59">
<meta name="background-color" content="#f3f8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lousa de Estudos">
<title>Lousa de Estudos</title>
<link rel="manifest" href="./manifest.webmanifest?v=48">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/lousa-icon-192.png?v=48">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/lousa-icon-512.png?v=48">
<link rel="apple-touch-icon" href="./icons/lousa-icon-192.png?v=48">
<style>
:root{color-scheme:light;--green:#2f9d59;--bg:#f3f8f5;--ink:#1f2937;--muted:#64748b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
#appFrame{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.splash{position:fixed;inset:0;z-index:200000;display:grid;place-items:center;background:var(--bg);transition:opacity .22s ease,visibility .22s ease}.splash.hide{opacity:0;visibility:hidden}.splashCard{text-align:center}.splashIcon{width:92px;height:92px;border-radius:25px;object-fit:cover;box-shadow:0 16px 36px rgba(47,157,89,.2)}.splashTitle{display:block;margin-top:15px;font-size:20px;font-weight:900}.splashText{margin-top:5px;color:var(--muted);font-size:13px}
.overlay{position:fixed;inset:0;z-index:210000;display:none;align-items:flex-end;justify-content:center;padding:18px;background:rgba(15,23,42,.46);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.overlay.show{display:flex}.card{position:relative;width:min(100%,430px);padding:22px;border:1px solid #dfe8e2;border-radius:26px;background:#fff;box-shadow:0 28px 90px rgba(15,23,42,.28);animation:up .22s ease-out}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:12px;background:#f1f5f2;color:#536159;font-size:23px}.installIcon{width:74px;height:74px;border-radius:20px;object-fit:cover;box-shadow:0 10px 24px rgba(47,157,89,.18)}.badge{display:inline-flex;margin-top:14px;padding:6px 10px;border-radius:999px;background:#eaf7ef;color:#1f7e45;font-size:11px;font-weight:900}.card h2{margin:10px 40px 7px 0;font-size:24px;line-height:1.15}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.status{margin-top:13px;padding:11px 12px;border:1px solid #e1ebe4;border-radius:14px;background:#f7faf8;color:#45564b;font-size:12px;line-height:1.45}.actions{display:grid;gap:9px;margin-top:15px}.primary,.secondary{width:100%;min-height:49px;border-radius:15px;padding:11px 15px;font-weight:900;font-size:14px}.primary{border:1px solid var(--green);background:var(--green);color:#fff;box-shadow:0 10px 20px rgba(47,157,89,.18)}.primary:disabled{opacity:.55}.secondary{border:1px solid #dce6df;background:#fff;color:#47564d}.updateCard{text-align:center}.updateIcon{font-size:42px}.updateCard h2{margin-right:0}
@media(min-width:700px){.overlay{align-items:center}}
</style>
</head>
<body>
<div id="splash" class="splash"><div class="splashCard"><img class="splashIcon" src="./icons/lousa-icon-512.png?v=48" alt=""><strong class="splashTitle">Lousa de Estudos</strong><div class="splashText">Preparando seus estudos...</div></div></div>
<iframe id="appFrame" src="./content-v48.html?v=48" title="Lousa de Estudos"></iframe>

<div id="installOverlay" class="overlay" aria-hidden="true">
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="installTitle">
    <button id="installClose" class="close" type="button" aria-label="Fechar">×</button>
    <img class="installIcon" src="./icons/lousa-icon-512.png?v=48" alt="">
    <div class="badge">Lousa de Estudos</div>
    <h2 id="installTitle">Instalar o aplicativo?</h2>
    <p>Instale a Lousa na tela inicial para abrir em tela cheia, como um aplicativo de verdade.</p>
    <div id="installStatus" class="status">Preparando a instalação...</div>
    <div class="actions">
      <button id="installPrimary" class="primary" type="button">Instalar agora</button>
      <button id="installLater" class="secondary" type="button">Agora não</button>
    </div>
  </div>
</div>

<div id="updateOverlay" class="overlay" aria-hidden="true">
  <div class="card updateCard" role="dialog" aria-modal="true" aria-labelledby="updateTitle">
    <div class="updateIcon">⬆️</div>
    <h2 id="updateTitle">Nova versão disponível</h2>
    <p>Há uma atualização da Lousa de Estudos pronta para usar.</p>
    <div class="actions"><button id="updateNow" class="primary" type="button">Atualizar agora</button></div>
  </div>
</div>

<script>
(() => {
  const VERSION='48';
  const installOverlay=document.getElementById('installOverlay');
  const installPrimary=document.getElementById('installPrimary');
  const installStatus=document.getElementById('installStatus');
  const updateOverlay=document.getElementById('updateOverlay');
  const updateNow=document.getElementById('updateNow');
  const frame=document.getElementById('appFrame');
  const splash=document.getElementById('splash');
  let deferredPrompt=null;
  let waitingWorker=null;
  let updateAccepted=false;

  const ua=(navigator.userAgent||'').toLowerCase();
  const isAndroid=/android/.test(ua);
  const isSamsung=/samsungbrowser/.test(ua);
  const isIOS=/iphone|ipad|ipod/.test(ua);
  const isMobile=isAndroid||isIOS||/mobile/.test(ua)||(navigator.maxTouchPoints>1&&Math.min(screen.width,screen.height)<1600);
  const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

  frame.addEventListener('load',()=>setTimeout(()=>splash.classList.add('hide'),120));
  setTimeout(()=>splash.classList.add('hide'),5500);

  function showInstall(){
    if(isStandalone()||!isMobile)return;
    try{if(localStorage.getItem('lousa:install-dismissed:v48')==='1')return}catch(e){}
    installOverlay.classList.add('show');
    installOverlay.setAttribute('aria-hidden','false');
    refreshInstallUI();
  }

  function hideInstall(remember=false){
    if(remember){try{localStorage.setItem('lousa:install-dismissed:v48','1')}catch(e){}}
    installOverlay.classList.remove('show');
    installOverlay.setAttribute('aria-hidden','true');
  }

  function refreshInstallUI(){
    if(deferredPrompt){
      installPrimary.disabled=false;
      installPrimary.textContent='Instalar agora';
      installStatus.textContent='Tudo pronto. Toque em Instalar agora e confirme a instalação do Android.';
      return;
    }
    installPrimary.disabled=false;
    installPrimary.textContent='Como instalar';
    if(isSamsung){
      installStatus.textContent='No Samsung Internet, abra o menu do navegador e escolha Adicionar página a, depois Tela inicial.';
    }else if(isAndroid){
      installStatus.textContent='No Chrome, abra o menu ⋮ e escolha Instalar aplicativo ou Adicionar à tela inicial.';
    }else if(isIOS){
      installStatus.textContent='No Safari, toque em Compartilhar e depois Adicionar à Tela de Início.';
    }else{
      installStatus.textContent='Use a opção Instalar aplicativo ou Adicionar à tela inicial do seu navegador.';
    }
  }

  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    deferredPrompt=event;
    if(installOverlay.classList.contains('show'))refreshInstallUI();
    else setTimeout(showInstall,250);
  });

  window.addEventListener('appinstalled',()=>{
    deferredPrompt=null;
    hideInstall(false);
    try{localStorage.setItem('lousa:installed','1')}catch(e){}
  });

  installPrimary.addEventListener('click',async()=>{
    if(!deferredPrompt){refreshInstallUI();return}
    const promptEvent=deferredPrompt;
    deferredPrompt=null;
    installPrimary.disabled=true;
    installPrimary.textContent='Abrindo instalação...';
    try{
      await promptEvent.prompt();
      const choice=await promptEvent.userChoice;
      if(choice&&choice.outcome==='accepted'){
        hideInstall(false);
      }else{
        installPrimary.disabled=false;
        installPrimary.textContent='Instalar agora';
        installStatus.textContent='A instalação foi cancelada. Você pode tentar novamente quando quiser.';
      }
    }catch(error){
      installPrimary.disabled=false;
      refreshInstallUI();
    }
  });
  document.getElementById('installLater').addEventListener('click',()=>hideInstall(true));
  document.getElementById('installClose').addEventListener('click',()=>hideInstall(true));

  function showUpdate(worker){
    if(!worker||waitingWorker===worker)return;
    waitingWorker=worker;
    updateOverlay.classList.add('show');
    updateOverlay.setAttribute('aria-hidden','false');
  }

  updateNow.addEventListener('click',()=>{
    if(!waitingWorker)return;
    updateAccepted=true;
    updateNow.disabled=true;
    updateNow.textContent='Atualizando...';
    waitingWorker.postMessage({type:'SKIP_WAITING'});
  });

  async function registerSW(){
    if(!('serviceWorker' in navigator))return;
    try{
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        if(updateAccepted)location.reload();
      });
      const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
      if(registration.waiting&&navigator.serviceWorker.controller)showUpdate(registration.waiting);
      registration.addEventListener('updatefound',()=>{
        const worker=registration.installing;
        if(!worker)return;
        worker.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate(worker);
        });
      });
      const check=()=>registration.update().catch(()=>{});
      setTimeout(check,1500);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')check()});
    }catch(error){
      console.warn('Service worker indisponível',error);
    }
  }

  registerSW();
  if(!isStandalone())setTimeout(showInstall,1300);
})();
</script>
</body>
</html>
