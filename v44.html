<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lousa de Estudos</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8f5;color:#1f2937}
.v44load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.v44card{background:#fff;border:1px solid #e1ebe4;border-radius:24px;padding:28px;box-shadow:0 18px 48px rgba(20,40,28,.10);max-width:420px}
.v44spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #dcebe0;border-top-color:#2f9d59;border-radius:50%;animation:v44spin .8s linear infinite}
@keyframes v44spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="v44load"><div class="v44card"><div class="v44spinner"></div><strong>Carregando a Lousa de Estudos</strong><p>Preparando a versão 44...</p></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./index.html?raw=v44&ts='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('Falha ao carregar a base do aplicativo');
    let html=await response.text();

    html=html.replace(/<meta name="app-version" content="[^"]*">/,'<meta name="app-version" content="44">');
    html=html.replace(/\.\/manifest\.webmanifest(?:\?[^"']*)?/g,'./manifest.webmanifest?v=44');
    html=html.replace(/\.\/icons\/lousa-icon\.svg(?:\?[^"']*)?/g,'./icons/lousa-icon-512.png?v=44');
    html=html.replace(/type="image\/svg\+xml"/g,'type="image/png"');

    html=html.replace(/<script>\s*\(\(\)\s*=>\s*\{\s*let deferredInstallPrompt=null;[\s\S]*?\}\)\(\);\s*<\/script>/g,'');

    html=html.replace(/<link rel="stylesheet" href="\.\/(?:v3[5-9]|v4[0-4]|pwa-v3[9]|pwa-v4[0-4])\.css\?v=\d+">\s*/g,'');
    html=html.replace(/<script src="\.\/(?:v3[5-9]|v4[0-4]|pwa-v3[9]|pwa-v4[0-4])\.js\?v=\d+"(?: defer)?><\/script>\s*/g,'');

    const css='\n<link rel="stylesheet" href="./v37.css?v=44">\n<link rel="stylesheet" href="./pwa-v39.css?v=44">\n';
    html=html.replace('</head>',css+'</head>');

    const scripts='\n<scr'+'ipt src="./v37.js?v=44"></scr'+'ipt>\n<scr'+'ipt src="./v41.js?v=44"></scr'+'ipt>\n<scr'+'ipt src="./pwa-v44.js?v=44"></scr'+'ipt>\n';
    html=html.replace('</body>',scripts+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.querySelector('.v44card').innerHTML='<strong>Não foi possível abrir agora.</strong><p>Feche esta aba e abra o link novamente.</p>';
    console.error(error);
  }
})();
</script>
</body>
</html>
