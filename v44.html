<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f9d59">
<title>Atualizando Lousa de Estudos</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8f5;color:#1f2937}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{width:min(100%,420px);background:#fff;border:1px solid #dce8df;border-radius:26px;padding:28px;box-shadow:0 20px 60px rgba(24,45,31,.12)}.spin{width:42px;height:42px;margin:0 auto 16px;border:4px solid #dcebe0;border-top-color:#2f9d59;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:#64748b;line-height:1.55}
</style>
</head>
<body>
<div class="wrap"><div class="card" id="card"><div class="spin"></div><strong>Corrigindo a instalação</strong><p>Removendo a versão antiga e preparando o instalador novo. Isso acontece uma única vez.</p></div></div>
<script>
(async()=>{
  const card=document.getElementById('card');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/lousa-de-estudos/')).map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('lousa-de-estudos-v')).map(k=>caches.delete(k)));
    }
    try{
      sessionStorage.removeItem('lousa:sw-migrated:v44');
      sessionStorage.removeItem('lousa:pwa-install-retry:v43');
    }catch(e){}
    const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
    const target=standalone?'./v46.html?pwa=1&v=46&clean=1':'./install-v46.html?v=46&clean=1';
    setTimeout(()=>location.replace(target+'&t='+Date.now()),350);
  }catch(error){
    card.innerHTML='<strong>Não foi possível limpar a versão antiga.</strong><p>Feche esta aba e abra o link novamente.</p>';
    console.error(error);
  }
})();
</script>
</body>
</html>
