<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c4dff"><link rel="manifest" href="manifest.webmanifest?v=20"><link rel="icon" href="icon.svg"><title>CasaToda</title><style>html,body{margin:0;height:100%;background:#f7f7fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.l{text-align:center;color:#1c1b2e}.s{width:42px;height:42px;border:5px solid #e5e2ef;border-top-color:#7c4dff;border-radius:50%;margin:0 auto 14px;animation:r .75s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.err{max-width:560px;padding:24px;border-radius:22px;background:#fff;color:#1c1b2e;box-shadow:0 14px 40px rgba(18,31,61,.12);line-height:1.45}</style></head><body><div class="l"><div class="s"></div><b style="font-size:20px">CasaToda</b><div id="loadMsg" style="font-size:13px;color:#7d7b92;margin-top:6px">Preparando sua família...</div></div><script>(async()=>{try{if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}const vr=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});if(!vr.ok)throw new Error('Não foi possível verificar a versão');const v=await vr.json();document.getElementById('loadMsg').textContent='Carregando CasaToda V20...';let b64='';for(const f of v.files){const r=await fetch('./'+v.payload+'/'+f+'?v='+v.version+'&layout=20&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+f);b64+=await r.text()}const gz=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream!=='function')throw new Error('Este navegador precisa ser atualizado para abrir o aplicativo');const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const parsed=new DOMParser().parseFromString(html,'text/html');for(const href of ['./layout15.css?v=20&t='+Date.now(),'./auth17.css?v=20&t='+Date.now(),'./layout18.css?v=20&t='+Date.now(),'./layout19.css?v=20&t='+Date.now(),'./layout20.css?v=20&t='+Date.now()]){const l=parsed.createElement('link');l.rel='stylesheet';l.href=href;parsed.head.appendChild(l)}const scripts=[...parsed.querySelectorAll('script')].map(s=>s.textContent||'');parsed.querySelectorAll('script').forEach(s=>s.remove());document.documentElement.innerHTML=parsed.documentElement.innerHTML;for(const code of scripts){if(code.trim()){const el=document.createElement('script');el.textContent=code;document.body.appendChild(el)}}for(const src of ['./v15.js?v=20&t='+Date.now(),'./v18.js?v=20&t='+Date.now(),'./v19.js?v=20&t='+Date.now(),'./v20.js?v=20&t='+Date.now()]){const r=await fetch(src,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar '+src);const el=document.createElement('script');el.textContent=await r.text();document.body.appendChild(el)}}catch(e){console.error(e);document.body.innerHTML='<div class="err"><b>Não foi possível iniciar o CasaToda.</b><br><br>'+String(e&&e.message?e.message:e)+'</div>'}})();</script></body></html>
