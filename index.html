<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Casa em Dia</title><style>html,body{margin:0;height:100%;background:#f4f6fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.l{text-align:center;color:#172033}.s{width:36px;height:36px;border:4px solid #dfe5f0;border-top-color:#4d7cff;border-radius:50%;margin:0 auto 12px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style><script src="patches/patch1.js?v=4"></script><script src="patches/patch2.js?v=4"></script><script src="patches/patch3.js?v=4"></script><script src="patches/patch4.js?v=4"></script></head><body><div class="l"><div class="s"></div><b>Casa em Dia</b><div style="font-size:12px;color:#768099;margin-top:5px">Carregando aplicativo...</div></div><script>(async()=>{try{const files=["part01.txt","part02.txt","part03a.txt","part03b.txt","part03c.txt","part03d.txt","part04.txt","part05.txt","part06a.txt","part06b.txt","part06c.txt","part06d.txt","part07.txt"];const parts=await Promise.all(files.map(f=>fetch("chunks/"+f+"?v=4").then(r=>{if(!r.ok)throw new Error(f);return r.text()})));const b64=parts.join("");const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html=new TextDecoder("utf-8").decode(bytes);html=window.applyCasaPatch1(html);html=window.applyCasaPatch2(html);html=window.applyCasaPatch3(html);html=window.applyCasaPatch4(html);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:24px;font-family:system-ui">Não foi possível carregar o aplicativo. Atualize a página.</div>'}})();</script></body></html>
