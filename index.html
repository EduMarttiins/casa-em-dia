<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f8f5"><title>Revisão do 5º ano</title><style>html,body{margin:0;min-height:100%;background:#f3f8f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{max-width:620px;text-align:center}.ico{font-size:50px}.msg{font-weight:800;color:#1f7e45;line-height:1.5}.small{font-size:13px;color:#64748b;line-height:1.5}.err{color:#991b1b}</style><script>window.__gzParts=[];</script><script src="assets/part0.js?v=16"></script><script src="assets/part1.js?v=16"></script><script src="assets/part2.js?v=16"></script><script src="assets/part3.js?v=16"></script><script src="assets/part4.js?v=16"></script><script src="assets/part5.js?v=16"></script><script src="assets/part6.js?v=16"></script><script src="assets/part7.js?v=16"></script></head><body><div class="wrap"><div class="box"><div class="ico">📚</div><p class="msg" id="msg">Abrindo a revisão...</p><p class="small" id="detail">Carregando a versão 16.</p></div></div><script>(async()=>{const msg=document.getElementById('msg'),detail=document.getElementById('detail');try{if(!window.__gzParts||window.__gzParts.length!==8||window.__gzParts.some(x=>!x))throw new Error('arquivos da revisão incompletos');const b64=window.__gzParts.join('');const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);let html;if('DecompressionStream' in window){detail.textContent='Montando o aplicativo...';const ds=new DecompressionStream('gzip');html=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text()}else{throw new Error('navegador sem suporte à descompactação necessária')}if(!html.includes('<html'))throw new Error('conteúdo final inválido');document.open();document.write(html);document.close()}catch(e){msg.className='msg err';msg.textContent='Não foi possível abrir a revisão.';detail.textContent='Detalhe: '+e.message;console.error(e)}})();</script></body></html>
