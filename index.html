<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Casa em Dia</title><style>html,body{margin:0;height:100%;background:#f4f6fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.l{text-align:center;color:#172033}.s{width:36px;height:36px;border:4px solid #dfe5f0;border-top-color:#4d7cff;border-radius:50%;margin:0 auto 12px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.err{max-width:560px;padding:22px;border-radius:18px;background:#fff;color:#172033;box-shadow:0 14px 40px rgba(18,31,61,.12);line-height:1.45}</style></head><body><div class="l"><div class="s"></div><b>Casa em Dia</b><div style="font-size:12px;color:#768099;margin-top:5px">Carregando versão 11...</div></div><script>(async()=>{try{const files=["part1.txt","part2.txt","part3.txt"];let b64="";for(const f of files){const r=await fetch("fullv11/"+f+"?v=11",{cache:"no-store"});if(!r.ok)throw new Error("Falha ao carregar "+f);b64+=await r.text()}const gz=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream!=="function")throw new Error("Navegador sem suporte à descompactação");const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));const html=await new Response(stream).text();const parsed=new DOMParser().parseFromString(html,"text/html");const scripts=[...parsed.querySelectorAll("script")].map(s=>s.textContent||"");parsed.querySelectorAll("script").forEach(s=>s.remove());document.documentElement.innerHTML=parsed.documentElement.innerHTML;for(const code of scripts){if(code.trim()){const el=document.createElement("script");el.textContent=code;document.body.appendChild(el)}}}catch(e){console.error(e);document.body.innerHTML='<div class="err"><b>Não foi possível iniciar o Casa em Dia.</b><br><br>'+String(e&&e.message?e.message:e)+'</div>'}})();</script></body></html>
