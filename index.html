<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Casa em Dia</title><style>html,body{margin:0;height:100%;background:#f4f6fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.l{text-align:center;color:#172033}.s{width:36px;height:36px;border:4px solid #dfe5f0;border-top-color:#4d7cff;border-radius:50%;margin:0 auto 12px;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.err{max-width:520px;padding:20px;border-radius:18px;background:#fff;color:#172033;box-shadow:0 14px 40px rgba(18,31,61,.12);line-height:1.45}</style><script src="patches/patch1.js?v=9"></script><script src="patches/patch2.js?v=9"></script><script src="patches/patch3.js?v=9"></script><script src="patches/patch4.js?v=9"></script><script src="patches/patch5.js?v=9"></script></head><body><div class="l"><div class="s"></div><b>Casa em Dia</b><div style="font-size:12px;color:#768099;margin-top:5px">Carregando aplicativo...</div></div><script>(async()=>{try{const files=["part01.txt","part02.txt","part03a.txt","part03b.txt","part03c.txt","part03d.txt","part04.txt","part05.txt","part06a.txt","part06b.txt","part06c.txt","part06d.txt","part07.txt"];const parts=await Promise.all(files.map(f=>fetch("chunks/"+f+"?v=9",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Falha ao carregar "+f);return r.text()})));const b64=parts.join("");const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));let html=new TextDecoder("utf-8").decode(bytes);html=window.applyCasaPatch1(html);html=window.applyCasaPatch2(html);html=window.applyCasaPatch3(html);html=window.applyCasaPatch4(html);html=window.applyCasaPatch5(html);const parsed=new DOMParser().parseFromString(html,"text/html");const scripts=[...parsed.querySelectorAll("script")].map(s=>s.textContent||"");parsed.querySelectorAll("script").forEach(s=>s.remove());document.documentElement.innerHTML=parsed.documentElement.innerHTML;for(const code of scripts){if(code.trim())(0,eval)(code)}}catch(e){console.error(e);document.body.innerHTML='<div class="err"><b>Não foi possível iniciar o Casa em Dia.</b><br><br>'+String(e&&e.message?e.message:e)+'</div>'}})();</script></body></html>
