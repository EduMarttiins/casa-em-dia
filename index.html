<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b35c9"><link rel="manifest" href="manifest.webmanifest?v=39"><link rel="icon" href="icon.svg?v=39"><title>CasaToda</title><style>html,body{margin:0;height:100%;background:#f7f7fb;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.l{text-align:center;color:#1c1b2e}.s{width:42px;height:42px;border:5px solid #e5e2ef;border-top-color:#7c4dff;border-radius:50%;margin:0 auto 14px;animation:r .75s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.err{max-width:560px;padding:24px;border-radius:22px;background:#fff;color:#1c1b2e;box-shadow:0 14px 40px rgba(18,31,61,.12);line-height:1.45}</style></head><body><div class="l"><div class="s"></div><b style="font-size:20px">CasaToda</b><div id="loadMsg" style="font-size:13px;color:#7d7b92;margin-top:6px">Preparando sua família...</div></div><script>window.__CASATODA_INSTALL_PROMPT=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__CASATODA_INSTALL_PROMPT=e;window.dispatchEvent(new Event('casatoda-install-ready'))});(async()=>{const sleep=ms=>new Promise(r=>setTimeout(r,ms));const clean=p=>p.replace(/^\.\//,'').split('?')[0];async function getText(path,critical=true){let last=null;for(let i=0;i<3;i++){try{const r=await fetch(path+(path.includes('?')?'&':'?')+'try='+i+'&t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.text();last=new Error('HTTP '+r.status)}catch(e){last=e}await sleep(350*(i+1))}try{const raw='https://raw.githubusercontent.com/EduMarttiins/casa-em-dia/main/'+clean(path)+'?t='+Date.now();const r=await fetch(raw,{cache:'no-store'});if(r.ok)return await r.text();last=new Error('Fallback HTTP '+r.status)}catch(e){last=e}if(critical)throw new Error('Falha ao carregar '+clean(path));console.warn('CasaToda ignorou módulo temporariamente indisponível',clean(path),last);return null}try{if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}const vtxt=await getText('./version.json',true);const v=JSON.parse(vtxt);document.getElementById('loadMsg').textContent='Carregando CasaToda V39...';let b64='';for(const f of v.files)b64+=await getText('./'+v.payload+'/'+f+'?v='+v.version+'&layout=39',true);const gz=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));if(typeof DecompressionStream!=='function')throw new Error('Este navegador precisa ser atualizado para abrir o aplicativo');const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const parsed=new DOMParser().parseFromString(html,'text/html');const css=['layout15.css','auth17.css','layout18.css','layout19.css','layout20.css','layout20fix.css','layout25.css','layout26.css','pwa24.css','layout27.css','layout30.css','reset33.css','layout34.css'];for(const f of css){const l=parsed.createElement('link');l.rel='stylesheet';l.href='./'+f+'?v=39&t='+Date.now();parsed.head.appendChild(l)}const scripts=[...parsed.querySelectorAll('script')].map(s=>s.textContent||'');parsed.querySelectorAll('script').forEach(s=>s.remove());document.documentElement.innerHTML=parsed.documentElement.innerHTML;for(const code of scripts){if(code.trim()){const el=document.createElement('script');el.textContent=code;document.body.appendChild(el)}}const modules=['v15.js','v18.js','v19.js','v20.js','v21.js','v25.js','v26.js','v28.js','sync30.js','v32.js','v33.js','v34.js','v35.js','v37.js','v38.js','v39.js','pwa24.js'];for(const f of modules){const code=await getText('./'+f+'?v=39',false);if(!code)continue;try{const el=document.createElement('script');el.textContent=code;document.body.appendChild(el)}catch(e){console.warn('Falha ao executar módulo '+f,e)}}}catch(e){console.error(e);document.body.innerHTML='<div class="err"><b>Não foi possível iniciar o CasaToda.</b><br><br>'+String(e&&e.message?e.message:e)+'<br><br><button onclick="location.reload()" style="border:0;border-radius:14px;padding:12px 18px;background:#6d43df;color:white;font-weight:800">Tentar novamente</button></div>'}})();</script></body></html>
