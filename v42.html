<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lousa de Estudos</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8f5;color:#1f2937}
.v42load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.v42card{background:#fff;border:1px solid #e1ebe4;border-radius:24px;padding:28px;box-shadow:0 18px 48px rgba(20,40,28,.10);max-width:420px}
.v42spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #dcebe0;border-top-color:#2f9d59;border-radius:50%;animation:v42spin .8s linear infinite}
@keyframes v42spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="v42load"><div class="v42card"><div class="v42spinner"></div><strong>Atualizando a Lousa de Estudos</strong><p>Carregando a versão 42...</p></div></div>
<script>
(async()=>{
  try{
    const fresh='./index.html?raw=v42&ts='+Date.now();
    const response=await fetch(fresh,{cache:'no-store'});
    if(!response.ok)throw new Error('Falha ao carregar a base do aplicativo');
    let html=await response.text();

    html=html.replace(/<meta name="app-version" content="[^"]*">/,'<meta name="app-version" content="42">');
    html=html.replace(/\.\/manifest\.webmanifest(?:\?[^"']*)?/g,'./manifest.webmanifest?v=42');
    html=html.replace(/\.\/icons\/lousa-icon\.svg(?:\?[^"']*)?/g,'./icons/lousa-icon-v35.jpg?v=42');
    html=html.replace(/type="image\/svg\+xml"/g,'type="image/jpeg"');

    html=html.replace(/<link rel="stylesheet" href="\.\/(?:v3[5-9]|v4[0-2]|pwa-v3[9]|pwa-v4[0-2])\.css\?v=\d+">\s*/g,'');
    html=html.replace(/<script src="\.\/(?:v3[5-9]|v4[0-2]|pwa-v3[9]|pwa-v4[0-2])\.js\?v=\d+"(?: defer)?><\/script>\s*/g,'');

    const css='\n<link rel="stylesheet" href="./v37.css?v=42">\n<link rel="stylesheet" href="./pwa-v39.css?v=42">\n';
    html=html.replace('</head>',css+'</head>');

    const scripts='\n<scr'+'ipt src="./v37.js?v=42"></scr'+'ipt>\n<scr'+'ipt src="./v41.js?v=42"></scr'+'ipt>\n<scr'+'ipt src="./pwa-v42.js?v=42"></scr'+'ipt>\n';
    html=html.replace('</body>',scripts+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.querySelector('.v42card').innerHTML='<strong>Não foi possível atualizar agora.</strong><p>Feche esta página, abra novamente e tente mais uma vez.</p>';
    console.error(error);
  }
})();
</script>
</body>
</html>
