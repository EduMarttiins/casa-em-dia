<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f8f5">
<title>Revisão do 5º ano</title>
<style>
html,body{margin:0;min-height:100%;background:#f3f8f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{max-width:620px;text-align:center;color:#1f2937}.ico{font-size:48px}.msg{font-weight:800;color:#1f7e45;line-height:1.5}.err{color:#991b1b}.small{font-size:13px;color:#64748b;line-height:1.5}
</style>
<script>window.__gzParts=[];</script>
<script src="./assets/part0.js"></script>
<script src="./assets/part1.js"></script>
<script src="./assets/part2.js"></script>
<script src="./assets/part3.js"></script>
<script src="./assets/part4.js"></script>
<script src="./assets/part5.js"></script>
<script src="./assets/part6.js"></script>
<script src="./assets/part7.js"></script>
</head>
<body>
<main><div class="box"><div class="ico">📚</div><p class="msg" id="msg">Abrindo a revisão...</p><p class="small" id="detail">A primeira abertura pode levar alguns segundos.</p></div></main>
<script>
(async()=>{
  const msg=document.getElementById('msg');
  const detail=document.getElementById('detail');
  try{
    if(!window.__gzParts||window.__gzParts.length<8||window.__gzParts.some(x=>!x)) throw new Error('partes incompletas');
    const b64=window.__gzParts.join('');
    const bin=atob(b64);
    const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    let txt='';
    if('DecompressionStream' in window){
      const ds=new DecompressionStream('gzip');
      txt=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();
    }else{
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';
        s.onload=resolve;
        s.onerror=reject;
        document.head.appendChild(s);
      });
      if(!window.pako) throw new Error('descompactador indisponível');
      txt=window.pako.ungzip(u8,{to:'string'});
    }
    if(!txt.includes('<!DOCTYPE html>')&&!txt.includes('<!doctype html>')) throw new Error('conteúdo inválido');
    document.open();
    document.write(txt);
    document.close();
  }catch(e){
    msg.className='msg err';
    msg.textContent='Não foi possível abrir a revisão neste navegador.';
    detail.textContent='Atualize a página. Se continuar, abra no Chrome, Safari ou Samsung Internet.';
    console.error(e);
  }
})();
</script>
</body>
</html>
