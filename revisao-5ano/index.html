<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f8f5">
<title>Revisão do 5º ano</title>
<style>
html,body{margin:0;min-height:100%;background:#f3f8f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{max-width:620px;text-align:center;color:#1f2937}.ico{font-size:48px}.msg{font-weight:800;color:#1f7e45;line-height:1.5}.err{color:#991b1b}.small{font-size:13px;color:#64748b;line-height:1.5}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/pako@2.1.0/dist/pako_inflate.min.js'"></script>
<script>window.__gzParts=[];</script>
<script src="./assets/part0.js?v=16c"></script>
<script src="./assets/part1.js?v=16c"></script>
<script src="./assets/part2.js?v=16c"></script>
<script src="./assets/part3.js?v=16c"></script>
<script src="./assets/part4.js?v=16c"></script>
<script src="./assets/part5.js?v=16c"></script>
<script src="./assets/part6.js?v=16c"></script>
<script src="./assets/part7.js?v=16c"></script>
</head>
<body>
<main><div class="box"><div class="ico">📚</div><p class="msg" id="msg">Abrindo a revisão...</p><p class="small" id="detail">Preparando a versão 16.</p></div></main>
<script>
(function(){
  const msg=document.getElementById('msg');
  const detail=document.getElementById('detail');
  try{
    if(!window.__gzParts||window.__gzParts.length<8||window.__gzParts.some(function(x){return !x})) throw new Error('os arquivos da revisão não carregaram');
    if(!window.pako||!window.pako.ungzip) throw new Error('o descompactador não carregou');
    detail.textContent='Montando o aplicativo...';
    const b64=window.__gzParts.join('');
    const bin=atob(b64);
    const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const txt=window.pako.ungzip(u8,{to:'string'});
    if(!txt||txt.indexOf('<html')===-1) throw new Error('o conteúdo da revisão ficou inválido');
    document.open();document.write(txt);document.close();
  }catch(e){
    msg.className='msg err';
    msg.textContent='Não foi possível abrir a revisão.';
    detail.textContent='Detalhe: '+(e&&e.message?e.message:'erro desconhecido');
    console.error(e);
  }
})();
</script>
</body>
</html>
