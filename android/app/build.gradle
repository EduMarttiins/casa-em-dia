plugins {
    id 'com.android.application'
}

def generatedLousaIconRes = file("$buildDir/generated/lousaIconRes")
def lousaIconBase64File = rootProject.file('lousa-icon-base64.txt')

android {
    namespace 'br.com.lousadeestudos'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.lousadeestudos'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    sourceSets {
        main {
            res.srcDir generatedLousaIconRes
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('prepareLousaIcon') {
    inputs.file(lousaIconBase64File)
    outputs.dir(generatedLousaIconRes)
    doLast {
        delete generatedLousaIconRes
        def drawableDir = new File(generatedLousaIconRes, 'drawable')
        drawableDir.mkdirs()
        def encoded = lousaIconBase64File.getText('UTF-8').replaceAll(/\s+/, '')
        new File(drawableDir, 'lousa_icon.webp').bytes = java.util.Base64.getDecoder().decode(encoded)
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareLousaIcon')
}
