plugins {
    id 'com.android.application'
}

def generatedLousaIconRes = file("$buildDir/generated/lousaIconRes")

android {
    namespace 'br.com.lousadeestudos'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.lousadeestudos'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    sourceSets {
        main {
            res.srcDir generatedLousaIconRes
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('prepareLousaIcon') {
    inputs.file(rootProject.file('../icons/lousa-icon-512.png'))
    outputs.dir(generatedLousaIconRes)
    doLast {
        delete generatedLousaIconRes
        copy {
            from rootProject.file('../icons/lousa-icon-512.png')
            into new File(generatedLousaIconRes, 'drawable')
            rename { 'lousa_icon.png' }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareLousaIcon')
}
