<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f9d59">
<title>Lousa de Estudos</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8f5;color:#1f2937}.boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{width:min(100%,420px);background:#fff;border:1px solid #e1ebe4;border-radius:24px;padding:28px;box-shadow:0 18px 48px rgba(20,40,28,.10)}.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #dcebe0;border-top-color:#2f9d59;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}p{color:#64748b;line-height:1.5}
</style>
</head>
<body>
<div class="boot"><div class="card"><div class="spinner"></div><strong>Abrindo a Lousa de Estudos</strong><p>Buscando a versão mais recente...</p></div></div>
<script>
(async()=>{
  const params=new URLSearchParams(location.search);
  const fallbackVersion=69;
  const hardUpdate=params.has('update')||params.get('force')==='1'||params.has('rescue');

  async function purgeOldRuntime(){
    try{
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>key.startsWith('lousa-de-estudos-v')).map(key=>caches.delete(key)));
      }
    }catch(error){}
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister().catch(()=>false)));
      }
    }catch(error){}
    await new Promise(resolve=>setTimeout(resolve,120));
  }

  try{
    if(hardUpdate)await purgeOldRuntime();

    let version=fallbackVersion;
    try{
      const response=await fetch('./app-version.json?boot='+Date.now()+'&force='+(hardUpdate?'1':'0'),{cache:'no-store'});
      if(response.ok){
        const data=await response.json();
        const remote=Number(data.contentVersion||0);
        if(remote>0)version=remote;
      }
    }catch(error){}

    const shell=version>=68?'./v68.html':'./v52.html';
    const target=new URL(shell,location.href);
    target.searchParams.set('pwa','1');
    target.searchParams.set('content',String(version));
    target.searchParams.set('boot',String(Date.now()));
    if(hardUpdate)target.searchParams.set('hard','1');
    if(params.get('androidapp')==='1')target.searchParams.set('androidapp','1');
    if(params.get('apk'))target.searchParams.set('apk',params.get('apk'));
    location.replace(target.toString());
  }catch(error){
    const target=new URL('./v68.html',location.href);
    target.searchParams.set('pwa','1');
    target.searchParams.set('content',String(fallbackVersion));
    target.searchParams.set('boot',String(Date.now()));
    if(params.get('androidapp')==='1')target.searchParams.set('androidapp','1');
    if(params.get('apk'))target.searchParams.set('apk',params.get('apk'));
    location.replace(target.toString());
  }
})();
</script>
</body>
</html>
