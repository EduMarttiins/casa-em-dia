<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f9d59">
<meta name="app-version" content="68">
<title>Lousa de Estudos</title>
<link rel="manifest" href="./manifest.webmanifest?v=68fix2">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/lousa-icon-192.png?v=68fix2">
<link rel="apple-touch-icon" href="./icons/lousa-icon-192.png?v=68fix2">
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f8f5;color:#1f2937}.v68load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.v68card{background:#fff;border:1px solid #e1ebe4;border-radius:24px;padding:28px;box-shadow:0 18px 48px rgba(20,40,28,.10);max-width:420px}.v68spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #dcebe0;border-top-color:#2f9d59;border-radius:50%;animation:v68spin .8s linear infinite}@keyframes v68spin{to{transform:rotate(360deg)}}
</style>
<script>
if('serviceWorker' in navigator){
  let reloadedForWorker=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloadedForWorker)return;
    reloadedForWorker=true;
    const target=new URL('./start.html',location.href);
    target.searchParams.set('pwa','1');
    target.searchParams.set('worker','68');
    target.searchParams.set('ts',String(Date.now()));
    const current=new URL(location.href);
    if(current.searchParams.get('androidapp')==='1')target.searchParams.set('androidapp','1');
    if(current.searchParams.get('apk'))target.searchParams.set('apk',current.searchParams.get('apk'));
    location.replace(target.toString());
  });
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('./sw.js?v=68fix2',{scope:'./',updateViaCache:'none'});
      await reg.update();
      if(reg.waiting)reg.waiting.postMessage({type:'SKIP_WAITING'});
    }catch(error){}
  },{once:true});
}
</script>
</head>
<body>
<div class="v68load"><div class="v68card"><div class="v68spinner"></div><strong>Carregando a Lousa de Estudos</strong><p>Preparando a versão 68...</p></div></div>
<script src="./loader-v68.js?v=68fix2"></script>
</body>
</html>
